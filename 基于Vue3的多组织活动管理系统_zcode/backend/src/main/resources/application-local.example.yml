# 复制为 application-local.yml 并填写本机数据库凭据；application-local.yml 不进入版本库。
# 测试环境的同名配置放在 src/test/resources/application-local.yml，URL 指向 activity_test。
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/activity_dev?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: activity
    password: "本机数据库密码"

# P8：组织 AI 模型配置的主加密密钥（Base64 的 32 字节 AES 密钥，例如
#   [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes('0123456789abcdef0123456789abcdef')) 得到的值）。
# 主密钥由部署环境保管：不进数据库、不进仓库、不提交；轮换时改动 master-key-id 并重新录入组织密钥。
# 本机联调如果要用本地桩模型服务，才临时开启 allow-private-hosts（生产必须保持 false）。
app:
  ai:
    master-key: "本机主密钥（Base64，32 字节）"
    master-key-id: local-v1
    # allow-private-hosts: true
