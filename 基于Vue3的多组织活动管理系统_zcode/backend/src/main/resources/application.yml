spring:
  application:
    name: activity
  config:
    # 本机凭据放在 backend/config/application-local.yml（仓库外，.gitignore 已忽略文件名），
    # 不进 classpath 也不进构建包（R08）。
    additional-location: optional:file:./config/
  datasource:
    # 默认指向本机开发库；实际凭据经 config/application-local.yml 或环境变量提供。
    url: ${ACTIVITY_DB_URL:jdbc:mysql://127.0.0.1:3306/activity_dev?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${ACTIVITY_DB_USERNAME:activity}
    password: ${ACTIVITY_DB_PASSWORD:}
    hikari:
      # 后端架构 5.1：业务事务统一 READ COMMITTED，配合组织行锁协议保证名额与并发正确。
      transaction-isolation: TRANSACTION_READ_COMMITTED
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 22MB

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    root: INFO
  file:
    name: ${ACTIVITY_LOG_FILE:./logs/activity.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 200MB
      clean-history-on-start: true
  pattern:
    level: "%5p [%X{requestId:-none}]"

app:
  upload:
    dir: ./uploads
    max-size-bytes: 20971520
  ai:
    # P8：AI 文本辅助的部署参数（后端架构 6.4／7）。主密钥只由部署环境提供（Base64 的 32 字节 AES 密钥），
    # 不进数据库、不进仓库；未提供时只有 AI 配置报错，核心业务与手工编写不受影响。
    enabled: ${ACTIVITY_AI_ENABLED:true}
    master-key: ${ACTIVITY_AI_MASTER_KEY:}
    master-key-id: ${ACTIVITY_AI_MASTER_KEY_ID:local-v1}
    # 允许访问的模型域名清单（支持 *.example.com 通配）；新增可信网关由部署扩充，不能只靠保存时校验。
    allowed-hosts: ${ACTIVITY_AI_ALLOWED_HOSTS:api.deepseek.com,open.bigmodel.cn,api.moonshot.cn,api.anthropic.com}
    # 仅供本机与自动化验证：允许 http、回环／私网地址与任意端口。生产必须保持 false。
    allow-private-hosts: ${ACTIVITY_AI_ALLOW_PRIVATE_HOSTS:false}
    max-concurrent-calls: ${ACTIVITY_AI_MAX_CONCURRENT_CALLS:2}
    max-calls-per-day-per-org: ${ACTIVITY_AI_MAX_CALLS_PER_DAY_PER_ORG:50}

server:
  address: 127.0.0.1
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        same-site: lax
        http-only: true
        # 开发环境为 http；生产按部署协议调整（开发规范 2.4）。
        secure: false
