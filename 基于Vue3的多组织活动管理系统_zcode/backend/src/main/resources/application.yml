spring:
  application:
    name: activity
  datasource:
    # 默认指向本机开发库；实际凭据经 application-local.yml（不入库，且构建排除）或环境变量提供。
    url: ${ACTIVITY_DB_URL:jdbc:mysql://127.0.0.1:3306/activity_dev?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${ACTIVITY_DB_USERNAME:activity}
    password: ${ACTIVITY_DB_PASSWORD:}
    hikari:
      # 后端架构 5.1：业务事务统一 READ COMMITTED，配合组织行锁协议保证名额与并发正确。
      transaction-isolation: TRANSACTION_READ_COMMITTED
  flyway:
    locations: classpath:db/migration

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  pattern:
    level: "%5p [%X{requestId:-none}]"

server:
  address: 127.0.0.1
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        same-site: lax
        http-only: true
        # 开发环境为 http；生产按部署协议调整（开发规范 2.4）。
        secure: false
