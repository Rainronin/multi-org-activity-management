spring:
  application:
    name: activity
  datasource:
    # 默认指向本机开发库；实际凭据经 application-local.yml（不入库）或环境变量提供。
    url: ${ACTIVITY_DB_URL:jdbc:mysql://127.0.0.1:3306/activity_dev?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${ACTIVITY_DB_USERNAME:activity}
    password: ${ACTIVITY_DB_PASSWORD:}
  flyway:
    locations: classpath:db/migration

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  pattern:
    level: "%5p [%X{requestId:-none}]"

server:
  address: 127.0.0.1
  port: 8080
